name: Sito

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sito-${{ github.ref }}
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requisiti.txt
      - name: Dipendenze
        run: pip install -r scripts/requisiti.txt
      - name: Generazione del sito dai soli file del repository
        run: python scripts/genera-sito.py
      - name: Controllo delle pagine generate
        run: |
          test -s site/index.html
          for d in dati/*/; do test -s "site/$(basename "$d")/index.html"; done
      - name: Prompt della chat allineato ai dati
        run: |
          git diff --exit-code -- lib/prompt-chat.js || {
            echo "lib/prompt-chat.js non corrisponde ai dati: rigenerarlo con python scripts/genera-sito.py e committarlo."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sito
          path: site
          retention-days: 7

  # Pubblicazione su Cloudflare Pages: parte solo quando nel repository sono impostati la variabile
  # PUBBLICA_CLOUDFLARE = si e i secret CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (impostati dal
  # 16/10/2026). Senza, si pubblica dal PC con npm run deploy, che parte solo da main pulito.
  pubblica:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBBLICA_CLOUDFLARE == 'si'
    needs: costruisci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sito
          path: site
      - name: Pubblicazione su Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.3 pages deploy site --project-name app-acquerello --branch main
